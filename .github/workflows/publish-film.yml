name: Publish optimized Casa Sol Tardio film

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-film.yml

permissions:
  contents: write

concurrency:
  group: publish-casa-film
  cancel-in-progress: false

jobs:
  encode-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the 2K master
        run: |
          python -m pip install --disable-pip-version-check --quiet gdown
          gdown 'https://drive.google.com/uc?id=1laZAF0hHBMTN8AvJr07sbgm2N8N8sPT-' --output /tmp/casa-film-master.mp4

      - name: Encode the portrait web master
        run: |
          mkdir -p assets/video
          ffmpeg -y -hide_banner -loglevel error -i /tmp/casa-film-master.mp4 \
            -vf 'scale=1080:1920:flags=lanczos' \
            -c:v libx264 -preset medium -profile:v high -level 4.1 \
            -b:v 3000k -maxrate 4500k -bufsize 9000k \
            -pass 1 -passlogfile /tmp/casa-film-pass -an -f mp4 /tmp/casa-film-pass1.mp4
          ffmpeg -y -hide_banner -loglevel error -i /tmp/casa-film-master.mp4 \
            -vf 'scale=1080:1920:flags=lanczos' \
            -c:v libx264 -preset medium -profile:v high -level 4.1 \
            -b:v 3000k -maxrate 4500k -bufsize 9000k \
            -pass 2 -passlogfile /tmp/casa-film-pass \
            -c:a aac -b:a 160k -movflags +faststart -map_metadata -1 \
            assets/video/casa-sol-tardio-film-1080x1920.mp4

      - name: Verify and publish the film
        run: |
          test "$(stat -c%s assets/video/casa-sol-tardio-film-1080x1920.mp4)" -lt 100000000
          ffmpeg -v error -i assets/video/casa-sol-tardio-film-1080x1920.mp4 -f null -
          git config user.name 'Mohannad Haikal'
          git config user.email '133853333+MohannadDS226@users.noreply.github.com'
          git add assets/video/casa-sol-tardio-film-1080x1920.mp4
          git commit -m 'Publish optimized portrait film'
          git push origin HEAD:main
