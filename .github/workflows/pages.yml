name: Deploy Casa Sol to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full-resolution Petals Afloat
        shell: bash
        run: |
          python -m pip install --quiet gdown pillow
          if gdown "https://drive.google.com/uc?id=125tSJctlZD7C2XgZlN5cbzMfTdOhVyB2" -O /tmp/petals-afloat.jpg; then
            python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('/tmp/petals-afloat.jpg')
          dst = Path('evidence-preview/petals-afloat-hq.webp')
          im = Image.open(src).convert('RGB')
          max_w = 2000
          if im.width > max_w:
              h = round(im.height * max_w / im.width)
              im = im.resize((max_w, h), Image.Resampling.LANCZOS)
          im.save(dst, 'WEBP', quality=92, method=6)
          print(f'Petals Afloat built: {im.width}x{im.height}, {dst.stat().st_size} bytes')
          PY
          else
            echo "::warning::Could not fetch full-resolution Petals Afloat; preserving fallback asset"
            cp evidence-preview/petals-afloat-new.webp evidence-preview/petals-afloat-hq.webp
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
