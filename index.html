<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <meta name="description" content="Casa Sol Tardío — a cinematic architectural visual story by Mohannad Haikal. Coming soon." />
  <title>Casa Sol Tardío — Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="public/assets/images/favicon.svg" />
  <link rel="preload" as="image" href="public/assets/images/CASA%20SOL%20TARD%C3%8DO_LOGO.png" />
  <link rel="stylesheet" href="coming-soon.css" />
</head>
<body>
  <main class="coming-soon" aria-label="Casa Sol Tardío coming soon">
    <div class="hero-video-wrap" aria-hidden="true">
      <video class="hero-video" autoplay muted loop playsinline preload="metadata">
        <source src="public/assets/video/coming-soon.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="wash" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <span class="monogram">MH</span>
      <span class="location">Mallorca · A Visual Story</span>
    </header>

    <section class="hero-copy">
      <p class="eyebrow">A project by Mohannad Haikal</p>
      <img
        class="title-artwork"
        src="public/assets/images/CASA%20SOL%20TARD%C3%8DO_LOGO.png"
        alt="Casa Sol Tardío"
        decoding="async"
      />
      <div class="rule" aria-hidden="true"></div>
      <div class="bottom-copy">
        <p class="tagline">Where light lingers, home begins.</p>
        <p class="status">Coming soon</p>
      </div>
    </section>

    <footer class="footerline">
      <span>Architecture · Memory · The Road Home</span>
      <span>MMXXVI</span>
    </footer>
  </main>

  <script src="coming-soon.js" defer></script>
</body>
</html>
